<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Skyward | Ops Test Console</title>
    <style>
      :root { color-scheme: dark; --ink:#e9efff; --muted:#9cabc4; --panel:#111c31; --line:#293957; --cyan:#4fe5ff; --amber:#ffc84c; --red:#ff7185; }
      * { box-sizing:border-box } body { margin:0; min-height:100vh; color:var(--ink); font:15px/1.5 ui-sans-serif,system-ui,sans-serif; background:radial-gradient(circle at 90% 0,#19396b 0,transparent 29rem),#07101f; }
      main { max-width:1080px; margin:auto; padding:36px 22px 64px; } h1 { margin:0; font-size:32px; letter-spacing:-.04em } h1 span { color:var(--cyan) } .eyebrow { color:var(--cyan); text-transform:uppercase; letter-spacing:.14em; font-size:11px; font-weight:700 } .subtitle { color:var(--muted); margin:8px 0 28px; }
      .grid { display:grid; grid-template-columns:1fr 1fr; gap:16px } .card { background:rgba(17,28,49,.92); border:1px solid var(--line); border-radius:14px; padding:20px; } h2 { margin:0 0 16px; font-size:17px } label { display:block; margin:12px 0 5px; color:var(--muted); font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.07em } select,input { width:100%; border:1px solid var(--line); border-radius:8px; padding:10px; background:#0a1426; color:var(--ink); font:inherit } button { cursor:pointer; border:0; border-radius:8px; padding:11px 14px; margin-top:16px; background:var(--cyan); color:#021421; font-weight:800; font:inherit } button.secondary { background:transparent; color:var(--ink); border:1px solid var(--line) } .full { grid-column:1/-1 } .status { display:flex; gap:8px; align-items:center; color:var(--muted); font-size:13px }.dot { width:8px;height:8px;border-radius:99px;background:var(--amber) }.ok .dot { background:#65e6a5 }.alert { background:#42202b; border-left:3px solid var(--red); padding:12px; border-radius:5px; margin-bottom:14px }.metrics { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin:16px 0 }.metric { padding:13px; background:#0a1426; border-radius:8px }.metric b { display:block; font-size:21px;color:var(--cyan) }.metric span { color:var(--muted); font-size:11px;text-transform:uppercase } pre { max-height:250px; overflow:auto; padding:14px; border-radius:8px; background:#07101f; color:#cddaff; font-size:12px } .hidden { display:none } @media (max-width:700px){.grid{grid-template-columns:1fr}.metrics{grid-template-columns:1fr 1fr}}
    </style>
  </head>
  <body><main>
    <div class="eyebrow">Prototype · Decision support only</div><h1>Sky<span>ward</span> Ops Console</h1><p class="subtitle">Simulate airport disruptions and evaluate compliant reroute proposals.</p>
    <div class="status" id="status"><i class="dot"></i><span>Connecting to API…</span></div>
    <section class="grid" style="margin-top:18px">
      <div class="card"><h2>1. Simulate disruption</h2><label for="airport">Affected airport</label><select id="airport"></select><label for="reason">Operational reason</label><input id="reason" value="Severe weather / airport closure" /><button class="secondary" id="close">Mark airport closed</button><div id="incident"></div></div>
      <div class="card"><h2>2. Propose reroute</h2><label for="flight">Active flight</label><select id="flight"></select><label for="destination">New destination</label><select id="destination"></select><label><input type="checkbox" id="terrain" checked style="width:auto" /> Avoid high terrain where practical</label><button id="reroute">Generate compliant reroute</button></div>
      <div class="card full hidden" id="result"><h2>Reroute recommendation</h2><div id="warning"></div><div class="metrics" id="metrics"></div><div id="summary"></div><pre id="raw"></pre></div>
    </section>
  </main><script>
    const $ = id => document.getElementById(id); let airports=[], flights=[];
    const api = async (path, options={}) => { const r=await fetch(path,{headers:{'content-type':'application/json'},...options}); const data=await r.json(); if(!r.ok) throw Error(data.error||'Request failed'); return data; };
    const fill = (element, values, label) => element.innerHTML=values.map(v=>`<option value="${v.icao||v.id}">${label(v)}</option>`).join('');
    async function init(){ try { [airports,flights]=await Promise.all([api('/v1/airports').then(x=>x.airports),api('/v1/flights').then(x=>x.flights)]); fill($('airport'),airports,a=>`${a.icao} — ${a.name}`); fill($('destination'),airports,a=>`${a.icao} — ${a.city}`); fill($('flight'),flights,f=>`${f.callsign} · ${f.origin} → ${f.destination} · ${f.passengers} pax`); $('status').className='status ok'; $('status').lastChild.textContent='API connected · Demo data loaded'; } catch(e) { $('status').lastChild.textContent=`API unavailable: ${e.message}`; } }
    $('close').onclick=async()=>{try{const data=await api('/v1/incidents',{method:'POST',body:JSON.stringify({airport:$('airport').value,type:'airport_closed',reason:$('reason').value})}); $('incident').innerHTML=`<p class="alert">${data.incident.airport} is now marked closed.</p>`}catch(e){alert(e.message)}};
    $('reroute').onclick=async()=>{try{const id=$('flight').value, data=await api(`/v1/flights/${id}/reroute`,{method:'POST',body:JSON.stringify({destination:$('destination').value,policy:{avoidHighTerrain:$('terrain').checked}})}); const p=data.passengerImpact,o=data.operationalAssessment; $('result').classList.remove('hidden'); $('warning').innerHTML=o.safeToPropose?'':`<div class="alert">Insufficient modeled fuel margin. Do not propose without dispatcher review.</div>`; $('metrics').innerHTML=`<div class="metric"><b>${p.extraMinutes} min</b><span>Added travel time</span></div><div class="metric"><b>${p.estimatedAffectedPassengers}</b><span>Passengers affected</span></div><div class="metric"><b>${o.fuelMarginMinutes} min</b><span>Fuel margin</span></div><div class="metric"><b>${data.route.distanceNm} NM</b><span>Route distance</span></div>`; $('summary').innerHTML=`<p><b>Waypoints:</b> ${data.route.waypoints.map(w=>w.icao||w.name||`${w.lat.toFixed(1)}, ${w.lon.toFixed(1)}`).join(' → ')}</p><p><b>Alternates:</b> ${data.alternates.map(a=>`${a.icao} (${a.distanceNm} NM)`).join(', ')||'None found'}</p><p><b>Restrictions avoided:</b> ${data.route.zonesAvoided.join(', ')||'None on proposed path'}</p>`; $('raw').textContent=JSON.stringify(data,null,2); }catch(e){alert(e.message)}}; init();
  </script></body>
</html>
